name: Report a bug
description: Tell us about something that isn't working as it should.
title: "[Bug] "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what you noticed, even if it only happened once.
        A short description in your own words is enough. We'll look into it
        and ask here if we need more information.

        **Issues are public.** Leave out passwords, ESPN sign-in cookies,
        private league links or IDs, and manager or team names.
        Hide private information in screenshots too.
  - type: textarea
    id: actual
    attributes:
      label: What went wrong?
      description: Tell us what you were trying to do and what happened instead.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device (optional)
      description: If you know, tell us what you're using. No version numbers needed.
      placeholder: Safari on an iPhone, or Chrome on a laptop
  - type: textarea
    id: context
    attributes:
      label: Screenshot or anything else you'd like to share (optional)
      description: You can add a screenshot or the message you saw, if helpful. Hide private information first. Don't attach league files or full reports.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before sharing
      options:
        - label: I haven't included passwords, sign-in cookies, or private league information.
          required: true
