name: Suggest an improvement
description: Share an idea or tell us what could be easier.
title: "[Improvement] "
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for LineupLift? We'd like to hear it.
        A short description is enough; you don't need a finished solution.

        **Issues are public.** Leave out passwords, ESPN sign-in cookies,
        private league links or IDs, and manager or team names.
        Hide private information in screenshots too.
  - type: textarea
    id: suggestion
    attributes:
      label: What would you like to improve?
      description: Tell us your idea or what you wish were easier.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: How would this help you? (optional)
      description: If you'd like, tell us when this would be useful or add a screenshot. Hide private information first. Don't attach league files or full reports.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before sharing
      options:
        - label: I haven't included passwords, sign-in cookies, or private league information.
          required: true
