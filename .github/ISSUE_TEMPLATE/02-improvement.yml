name: Improvement or feature request
description: Suggest a feature, usability improvement, or clearer explanation.
title: "[Improvement] "
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Describe one improvement per issue. Search existing issues first and add
        a reaction or details if the idea is already there.
        **Everything here is public.** Use generic or synthetic examples and
        remove private league information from text and attachments.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and what is difficult or missing today.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What would you like to change?
      description: Explain the improvement and how it would help. A rough idea is enough.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or current workaround
      description: Optional. Describe anything you have tried or other ways to solve the problem.
  - type: textarea
    id: context
    attributes:
      label: Additional context or redacted mockups
      description: Optional. Use generic or synthetic examples without identifying a real league.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have checked that this issue and any attachments contain no credentials or private league information.
          required: true
